name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    env:
      # Dummy value: tests mock every OpenRouter call and block real network access.
      OPENROUTER_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/*/requirements.txt
            backend/requirements-dev.txt

      - name: Install service and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r backend/meal_service/requirements.txt \
            -r backend/coach_service/requirements.txt \
            -r backend/health_service/requirements.txt \
            -r backend/event_service/requirements.txt \
            -r backend/requirements-dev.txt

      - name: Lint (ruff, error rules only)
        run: ruff check backend

      - name: Test (pytest)
        run: pytest backend/tests -v

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec.lock requires Flutter >= 3.35.0 (Dart >= 3.9).
          flutter-version: 3.35.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test
